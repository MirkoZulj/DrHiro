[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drhiro-tools"
version = "0.1.0"
description = "drHiro on TrueForge — MCP tool server (synthetic, non-diagnostic care preparation)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp<2",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/drhiro_tools"]
