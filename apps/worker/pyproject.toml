[project]
name = "drhiro-worker"
version = "0.1.0"
description = "drHiro async worker: reminders, aggregates, summaries, alert recompute"
requires-python = ">=3.11"
dependencies = [
    "rq>=1.16,<2",
    "redis>=5.0,<6",
    "sqlalchemy>=2.0.30,<3",
    "psycopg[binary]>=3.2,<4",
    "drhiro-api>=0.1.0,<1",
    "drhiro-analytics>=0.1.0,<1",
    # analytics engine runtime (pinned per spec §8) — also duplicated here so
    # the worker image resolves them even if drhiro-analytics metadata drifts
    "numpy>=1.26,<3",
    "pandas>=2.0,<3",
    "scipy>=1.11,<2",
    "ruptures>=1.1.9,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
