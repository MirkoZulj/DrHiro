server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed Vite assets are content-addressed: cache them forever.
    # A missing asset 404s here — never serve index.html as "JS".
    # Serving HTML for a dead bundle hash turns any stale index.html
    # reference into a silent blank page after a redeploy.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Entry document: always revalidate. index.html names the current
    # hashed bundle; a cached stale copy points at assets that no
    # longer exist after a redeploy (blank dashboard, green API).
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
