# gitleaks config — allow known SYNTHETIC test-fixture values that are not
# real credentials. These appear only in pytest conftest.py test setup, never
# in production code or config. They exist solely to satisfy app code that
# requires a non-empty env var at import time.
#
# Real secrets must NEVER be added here. If gitleaks flags something, first
# determine whether it is a genuine credential before considering an allow.

[allowlist]
  description = "Synthetic pytest test-fixture values (conftest.py only) — not real credentials"

  # pytest conftest sets a dummy DRHIRO_JWT_SECRET for the test app
  regexes = [
    '''pytest-dummy-not-a-real-secret''',
    # pytest conftest sets a dummy (obviously-invalid) Telegram bot token
    '''000000:TESTONLYnotarealbottoken''',
  ]
