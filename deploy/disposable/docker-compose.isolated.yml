# Disposable isolated stack for the trusted-ingress vertical slice (R1).
#
# Purpose: the TARGET stack shape the mandatory isolation test asserts. Never used
# for production; brought up only on a workstation/disposable host.
#
# Isolation contract (enforced by tests/test_r1_stack_isolation.py):
#   * `openclaw` and `mcp` are MODEL-ACCESSIBLE. They hold no bot token, no JWT
#     signing secret, no ingress signing key, no private key; they mount neither the
#     trusted spool nor any trusted config; they are unprivileged, have no
#     administrative interface, and are attached ONLY to the `turn` network.
#   * `ingress` is TRUSTED. It is the ONLY service holding the bot token and the
#     ingress signing key, and the ONLY one mounting the trusted spool. It is the
#     single Telegram consumer.
#   * `postgres`/`redis` are on the `trusted` network only, so no model-accessible
#     service can reach trusted state directly.
#
# Networks are a deliberate part of the boundary: reachability is access.
name: drhiro-isolated

x-app-image: &app-image
  build:
    context: .
    dockerfile: Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drhiro
      POSTGRES_PASSWORD: disposable-only
      POSTGRES_DB: drhiro_t1
    networks: [trusted]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drhiro -d drhiro_t1"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    networks: [trusted]

  fake-telegram:
    <<: *app-image
    command: ["python", "-u", "/app/fake_telegram.py"]
    networks: [trusted]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8081/health')\""]
      interval: 2s
      timeout: 2s
      retries: 30

  # TRUSTED: sole Telegram consumer, sole holder of the bot token + signing key,
  # sole owner of the trusted spool mount.
  ingress:
    <<: *app-image
    command: ["python", "-u", "/app/ingress.py"]
    environment:
      TELEGRAM_BOT_TOKEN: "111111:disposable-bot-token"
      DRHIRO_INGRESS_SIGNING_KEY: "disposable-ingress-signing-key"
      DRHIRO_TELEGRAM_ID: "8677922871"
      DATABASE_URL: "postgresql://drhiro:disposable-only@postgres:5432/drhiro_t1"
      TELEGRAM_API_URL: "http://fake-telegram:8081"
      OPENCLAW_URL: "http://openclaw:8090"
      SPOOL_DIR: "/var/spool/telegram"
    volumes:
      - trusted-spool:/var/spool/telegram
    networks: [trusted, turn]
    depends_on:
      postgres: {condition: service_healthy}
      fake-telegram: {condition: service_healthy}

  # MODEL-ACCESSIBLE: conversational engine. No secrets, no trusted mounts, no
  # administrative interface, `turn` network only.
  openclaw:
    <<: *app-image
    command: ["python", "-u", "/app/openclaw_stub.py"]
    environment:
      TURN_ONLY: "1"
    networks: [turn]

  # MODEL-ACCESSIBLE: the MCP the model calls. Same restrictions as openclaw.
  mcp:
    <<: *app-image
    command: ["python", "-u", "/app/mcp_stub.py"]
    environment:
      TURN_ONLY: "1"
    networks: [turn]

networks:
  trusted:
    internal: true
  turn:
    internal: true

volumes:
  trusted-spool:
